<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Tavoni 8</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup"
      aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <!-- Left side links -->
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'home:home' %}">Travels</a>
      </div>

      <!-- Right side -->
      <div class="d-flex ms-auto align-items-center">
        {% if request.user.is_authenticated %}
          <span class="user-badge">{{ request.user.phone_number }}</span>

          {% if request.user.is_driver %}
            <a class="btn btn-outline-primary me-2" href="{% url 'travel:create_travel' %}">Start Travel</a>
            <a class="btn btn-outline-primary me-2" href="{% url 'travel:driver_travels' %}">My Travels</a>
          {% endif %}

          {% if request.user.is_passenger %}
            <a class="btn btn-outline-success me-2" href="{% url 'travel:my_tickets' %}">My Tickets</a>
          {% endif %}

          <a class="btn btn-outline-danger" href="{% url 'accounts:logout' %}">Logout</a>

        {% else %}
          <!-- Passenger -->
          <div class="dropdown me-2">
            <button class="btn btn-primary dropdown-toggle modern-btn" type="button" data-bs-toggle="dropdown">
              Passenger
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="{% url 'accounts:passenger_register' %}">Register</a></li>
              <li><a class="dropdown-item" href="{% url 'accounts:passenger_login' %}">Login</a></li>
            </ul>
          </div>

          <!-- Driver -->
          <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle modern-btn" type="button" data-bs-toggle="dropdown">
              Driver
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="{% url 'accounts:driver_register' %}">Register</a></li>
              <li><a class="dropdown-item" href="{% url 'accounts:driver_login' %}">Login</a></li>
            </ul>
          </div>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
