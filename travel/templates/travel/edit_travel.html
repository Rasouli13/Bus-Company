{% extends 'base.html' %}
{% load static %}

{% block extra_headers %}
<link rel="stylesheet" href="{% static 'travel/css/create_travel_style.css' %}">
{% endblock %}

{% block content %}
<div class="create-travel-container">
  <h2>Edit Travel</h2>
  
  <form method="post" class="create-travel-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
  </form>
</div>
{% endblock %}
